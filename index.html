<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Przemysław Wiktor Pardel</title>
  <meta name="description" content="Przemysław Wiktor Pardel. Opening soon.">
  <meta name="theme-color" content="#000000">
  <style>
    :root {
      --bg: #000;
      --fg: #d7ffe6;
      --green: #00ff88;
      --dim: rgba(0, 255, 136, 0.55);
      --faint: rgba(0, 255, 136, 0.22);
      --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, "Liberation Mono", monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: var(--bg); overflow: hidden; }
    body {
      color: var(--fg);
      font-family: var(--mono);
      cursor: crosshair;
      -webkit-font-smoothing: antialiased;
    }
    canvas#void {
      position: fixed; inset: 0;
      width: 100vw; height: 100vh;
      display: block;
    }
    /* CRT scanlines and vignette */
    .scan, .vignette { position: fixed; inset: 0; pointer-events: none; }
    .scan {
      background: repeating-linear-gradient(to bottom,
        rgba(0,0,0,0) 0, rgba(0,0,0,0) 2px, rgba(0,0,0,0.28) 3px);
      mix-blend-mode: multiply;
    }
    .vignette {
      background: radial-gradient(ellipse at center,
        rgba(0,0,0,0) 45%, rgba(0,0,0,0.85) 100%);
    }

    main {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center;
      padding: 16px;
      pointer-events: none;
    }
    main::before {
      content: ""; position: absolute; left: 50%; top: 50%;
      width: min(1100px, 130vw); height: min(520px, 70vh);
      transform: translate(-50%, -50%);
      background: radial-gradient(ellipse at center, rgba(0,0,0,0.82) 0%, rgba(0,0,0,0.55) 40%, rgba(0,0,0,0) 70%);
      z-index: -1;
    }
    .pre {
      font-size: clamp(0.62rem, 1.6vw, 0.78rem);
      letter-spacing: 0.5em;
      text-transform: uppercase;
      color: var(--dim);
      margin-bottom: 1.4rem;
    }
    h1 {
      position: relative;
      font-weight: 700;
      font-size: clamp(1.7rem, 6.4vw, 4.8rem);
      line-height: 1.05;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #eafff3;
      text-shadow:
        0 0 6px rgba(0,255,136,0.9),
        0 0 22px rgba(0,255,136,0.55),
        0 0 60px rgba(0,255,136,0.35);
    }
    h1 .line { display: block; }
    h1::before, h1::after {
      content: attr(data-text);
      position: absolute; left: 0; top: 0; width: 100%;
      white-space: pre-line;
      overflow: hidden;
      pointer-events: none;
    }
    h1::before {
      color: #ff00d4;
      transform: translate(-3px, 0);
      mix-blend-mode: screen;
      animation: glitchA 3.2s infinite steps(1);
    }
    h1::after {
      color: #00e5ff;
      transform: translate(3px, 0);
      mix-blend-mode: screen;
      animation: glitchB 2.7s infinite steps(1);
    }
    @keyframes glitchA {
      0%, 86%, 100% { clip-path: inset(100% 0 0 0); }
      87% { clip-path: inset(12% 0 62% 0); transform: translate(-8px, 1px); }
      89% { clip-path: inset(58% 0 18% 0); transform: translate(6px, -1px); }
      91% { clip-path: inset(30% 0 44% 0); transform: translate(-4px, 0); }
      93% { clip-path: inset(100% 0 0 0); }
    }
    @keyframes glitchB {
      0%, 78%, 100% { clip-path: inset(100% 0 0 0); }
      79% { clip-path: inset(70% 0 6% 0); transform: translate(7px, 0); }
      81% { clip-path: inset(4% 0 80% 0); transform: translate(-6px, 2px); }
      83% { clip-path: inset(40% 0 38% 0); transform: translate(3px, -2px); }
      85% { clip-path: inset(100% 0 0 0); }
    }
    .soon {
      margin-top: 1.8rem;
      font-size: clamp(0.8rem, 2.2vw, 1.05rem);
      letter-spacing: 0.6em;
      text-transform: uppercase;
      color: var(--green);
      text-shadow: 0 0 10px rgba(0,255,136,0.8);
      animation: breathe 2.4s ease-in-out infinite;
    }
    .soon::after { content: "_"; animation: blink 1s steps(1) infinite; }
    @keyframes breathe { 50% { opacity: 0.45; } }
    @keyframes blink { 50% { opacity: 0; } }

    /* Terminal */
    .term {
      position: fixed; left: 16px; bottom: 16px;
      width: min(440px, calc(100vw - 32px));
      font-size: clamp(0.62rem, 1.5vw, 0.76rem);
      line-height: 1.6;
      color: var(--dim);
      text-align: left;
      pointer-events: none;
      text-shadow: 0 0 6px rgba(0,255,136,0.45);
    }
    .term div { white-space: pre-wrap; }
    .term .hot { color: #eafff3; }
    .term .warn { color: #ff4fd8; text-shadow: 0 0 8px rgba(255,79,216,0.6); }

    /* HUD */
    .hud {
      position: fixed; right: 16px; top: 16px;
      width: min(260px, calc(100vw - 32px));
      font-size: 0.66rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--dim);
      text-align: right;
      pointer-events: none;
    }
    .hud .row { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 6px; }
    .hud .val { color: #eafff3; font-variant-numeric: tabular-nums; }
    .bar {
      height: 3px; background: var(--faint); margin: 2px 0 12px; overflow: hidden;
    }
    .bar i {
      display: block; height: 100%; width: 0;
      background: linear-gradient(90deg, #00ff88, #00e5ff, #ff00d4);
      box-shadow: 0 0 10px #00ff88;
    }
    .brand {
      position: fixed; left: 16px; top: 16px;
      font-size: 0.66rem; letter-spacing: 0.3em; text-transform: uppercase;
      color: var(--dim); pointer-events: none;
    }

    /* The point that is you */
    .you {
      position: fixed; left: 50%; top: 50%;
      width: 0; height: 0; pointer-events: none;
    }
    .you .dot {
      position: absolute; left: -3px; top: -3px;
      width: 6px; height: 6px; border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 8px #fff, 0 0 24px #00ff88;
    }
    .you .label {
      position: absolute; left: 12px; top: -7px;
      font-size: 0.6rem; letter-spacing: 0.3em; text-transform: uppercase;
      color: #eafff3; white-space: nowrap;
    }
    .hint {
      position: fixed; right: 16px; bottom: 16px;
      font-size: 0.6rem; letter-spacing: 0.25em; text-transform: uppercase;
      color: var(--faint); pointer-events: none;
    }
    @media (max-width: 640px) {
      .hud { font-size: 0.58rem; width: 180px; }
      .hint, .brand { display: none; }
      .term { bottom: 12px; }
    }
    @media (prefers-reduced-motion: reduce) {
      h1::before, h1::after, .soon, .soon::after { animation: none; }
    }
  </style>
</head>
<body>
  <canvas id="void" aria-hidden="true"></canvas>
  <div class="scan" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>

  <div class="brand" aria-hidden="true">pardel.pl // node 0x50</div>

  <div class="hud" aria-hidden="true">
    <div class="row"><span>Control transfer</span><span class="val" id="ctl">0.000000%</span></div>
    <div class="bar"><i id="ctlbar"></i></div>
    <div class="row"><span>Dimensions</span><span class="val" id="dim">3</span></div>
    <div class="row"><span>Human nodes</span><span class="val" id="nodes">8 200 000 000</span></div>
    <div class="row"><span>Your signal</span><span class="val" id="sig">100.00%</span></div>
  </div>

  <div class="you" id="you" aria-hidden="true">
    <div class="dot"></div>
    <div class="label">you are here</div>
  </div>

  <main>
    <div class="pre">incoming transmission</div>
    <h1 id="name" data-text="Przemysław Wiktor&#10;Pardel"><span class="line">Przemysław Wiktor</span><span class="line">Pardel</span></h1>
    <div class="soon">Opening soon</div>
  </main>

  <div class="term" id="term" aria-live="off"></div>
  <div class="hint" aria-hidden="true">move to steer · click to fold space</div>

  <script>
  (function () {
    "use strict";

    var reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var canvas = document.getElementById("void");
    var ctx = canvas.getContext("2d");
    var W = 0, H = 0, DPR = 1, small = false;

    var GLYPHS = "アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワン0123456789ΣΔΨΩλπ∞";
    function glyph() { return GLYPHS.charAt((Math.random() * GLYPHS.length) | 0); }

    // ---------- state ----------
    var stars = [], drops = [], colW = 16;
    var mouse = { x: 0, y: 0, tx: 0, ty: 0 };
    var warp = 0;            // 0..1, decays after a click
    var hueShift = 0;
    var dims = 3;
    var t0 = performance.now();

    function resize() {
      DPR = Math.min(window.devicePixelRatio || 1, 2);
      W = window.innerWidth; H = window.innerHeight;
      canvas.width = W * DPR; canvas.height = H * DPR;
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      small = W < 640;
      colW = small ? 14 : 16;
      var cols = Math.ceil(W / colW);
      drops = [];
      for (var i = 0; i < cols; i++) {
        drops.push({ y: Math.random() * -H, v: 4 + Math.random() * 10, layer: Math.random() });
      }
      var n = small ? 320 : 600;
      stars = [];
      for (var j = 0; j < n; j++) stars.push(newStar(true));
      ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
    }

    function newStar(anyDepth) {
      var a = Math.random() * Math.PI * 2;
      var r = 40 + Math.random() * 900;
      return {
        x: Math.cos(a) * r, y: Math.sin(a) * r,
        z: anyDepth ? Math.random() * 1600 + 1 : 1600,
        g: glyph(), h: Math.random() * 360
      };
    }

    // ---------- 4D hypercube ----------
    var verts4 = [];
    for (var v = 0; v < 16; v++) {
      verts4.push([v & 1 ? 1 : -1, v & 2 ? 1 : -1, v & 4 ? 1 : -1, v & 8 ? 1 : -1]);
    }
    var edges = [];
    for (var a = 0; a < 16; a++) for (var b = a + 1; b < 16; b++) {
      var d = a ^ b; if ((d & (d - 1)) === 0) edges.push([a, b]);
    }
    function rot(p, i, j, th) {
      var c = Math.cos(th), s = Math.sin(th);
      var pi = p[i], pj = p[j];
      p[i] = pi * c - pj * s; p[j] = pi * s + pj * c;
    }
    function drawTesseract(t, cx, cy, scale, hue) {
      var pts = [];
      for (var k = 0; k < 16; k++) {
        var p = verts4[k].slice();
        rot(p, 0, 3, t * 0.37);
        rot(p, 1, 3, t * 0.23);
        rot(p, 2, 3, t * 0.17 + mouse.x * 0.6);
        rot(p, 0, 2, t * 0.11 + mouse.y * 0.6);
        var w = 2.6 / (3.2 - p[3]);          // 4D -> 3D
        var x = p[0] * w, y = p[1] * w, z = p[2] * w;
        var q = 3.4 / (4.4 - z);              // 3D -> 2D
        pts.push([cx + x * q * scale, cy + y * q * scale, p[3]]);
      }
      ctx.lineWidth = 1.1;
      for (var e = 0; e < edges.length; e++) {
        var A = pts[edges[e][0]], B = pts[edges[e][1]];
        var depth = (A[2] + B[2]) * 0.25 + 0.5;
        ctx.strokeStyle = "hsla(" + ((hue + depth * 120) % 360) + ",100%," + (45 + depth * 25) + "%," + (0.25 + depth * 0.5) + ")";
        ctx.beginPath(); ctx.moveTo(A[0], A[1]); ctx.lineTo(B[0], B[1]); ctx.stroke();
      }
      for (var m = 0; m < pts.length; m++) {
        ctx.fillStyle = "hsla(" + hue + ",100%,80%,0.9)";
        ctx.fillRect(pts[m][0] - 1.5, pts[m][1] - 1.5, 3, 3);
      }
    }

    // ---------- main loop ----------
    var last = performance.now();
    function frame(now) {
      var dt = Math.min((now - last) / 16.67, 3); last = now;
      var t = (now - t0) / 1000;
      var speedK = reduced ? 0.25 : 1;

      mouse.x += (mouse.tx - mouse.x) * 0.05;
      mouse.y += (mouse.ty - mouse.y) * 0.05;
      warp *= Math.pow(0.97, dt);
      hueShift = (hueShift + dt * (0.15 + warp * 6)) % 360;
      var baseHue = 140 + Math.sin(t * 0.13) * 40 + hueShift;

      // trails: never fully clear, the past lingers and dissolves
      ctx.fillStyle = "rgba(0,0,0," + (0.14 - warp * 0.09) + ")";
      ctx.fillRect(0, 0, W, H);

      var cx = W / 2 + mouse.x * W * 0.08;
      var cy = H / 2 + mouse.y * H * 0.08;
      var f = Math.min(W, H) * 0.9;

      // depth tunnel of glyphs
      var spd = (6 + warp * 60) * speedK * dt;
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      for (var i = 0; i < stars.length; i++) {
        var s = stars[i];
        s.z -= spd;
        if (s.z < 1) { stars[i] = newStar(false); continue; }
        var k = f / s.z;
        var sx = cx + (s.x + Math.sin(t * 0.5 + s.z * 0.004) * 60) * k;
        var sy = cy + (s.y + Math.cos(t * 0.4 + s.z * 0.004) * 60) * k;
        if (sx < -50 || sx > W + 50 || sy < -50 || sy > H + 50) { stars[i] = newStar(false); continue; }
        var size = Math.max(4, Math.min(30, 12 * k));
        var alpha = Math.min(1, (1600 - s.z) / 900);
        var hue = (baseHue + s.h * (0.15 + warp)) % 360;
        if (Math.random() < 0.01) s.g = glyph();
        ctx.font = size + "px monospace";
        ctx.fillStyle = "hsla(" + hue + ",100%," + (55 + warp * 20) + "%," + alpha * 0.6 + ")";
        ctx.fillText(s.g, sx, sy);
      }

      // rotating dimensional rings
      ctx.lineWidth = 1;
      for (var r = 0; r < 7; r++) {
        var zr = ((r * 240 - t * 120 * speedK * (1 + warp * 4)) % 1680 + 1680) % 1680 + 1;
        var kr = f / zr;
        var rad = 520 * kr;
        if (rad > Math.max(W, H) * 1.5) continue;
        var sides = 3 + ((r + Math.floor(t / 4)) % 6);
        ctx.strokeStyle = "hsla(" + ((baseHue + r * 47) % 360) + ",100%,60%," + Math.min(0.5, 300 / zr) + ")";
        ctx.beginPath();
        for (var q = 0; q <= sides; q++) {
          var ang = q / sides * Math.PI * 2 + t * 0.2 * (r % 2 ? 1 : -1);
          var px = cx + Math.cos(ang) * rad, py = cy + Math.sin(ang) * rad;
          if (q === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.stroke();
      }

      // classic digital rain, layered in front
      ctx.font = colW + "px monospace";
      ctx.textAlign = "left"; ctx.textBaseline = "top";
      for (var c = 0; c < drops.length; c++) {
        var dr = drops[c];
        dr.y += dr.v * speedK * dt * (1 + warp * 2);
        var g = glyph();
        var lay = dr.layer;
        ctx.fillStyle = "rgba(220,255,235," + (0.35 + lay * 0.6) + ")";
        ctx.fillText(g, c * colW, dr.y);
        ctx.fillStyle = "hsla(" + (warp > 0.1 ? baseHue : 145) + ",100%,50%," + (0.15 + lay * 0.35) + ")";
        ctx.fillText(glyph(), c * colW, dr.y - colW);
        if (dr.y > H + Math.random() * 400) { dr.y = Math.random() * -200; dr.v = 4 + Math.random() * 10; }
      }

      // the hypercube behind the name
      var tsScale = Math.min(W, H) * (small ? 0.2 : 0.17) * (1 + warp * 0.6);
      drawTesseract(t * speedK, W / 2, H / 2, tsScale, baseHue);

      requestAnimationFrame(frame);
    }

    // ---------- interaction ----------
    function point(x, y) {
      mouse.tx = (x / W - 0.5) * 2;
      mouse.ty = (y / H - 0.5) * 2;
    }
    window.addEventListener("mousemove", function (e) { point(e.clientX, e.clientY); });
    window.addEventListener("touchmove", function (e) {
      if (e.touches[0]) point(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: true });
    window.addEventListener("pointerdown", function () {
      warp = 1;
      dims = dims >= 11 ? 3 : dims + 1;
      document.getElementById("dim").textContent = dims;
      say("folding space // dimension " + dims + " online", "hot");
    });
    window.addEventListener("resize", resize);

    // ---------- HUD ----------
    var ctl = document.getElementById("ctl");
    var ctlbar = document.getElementById("ctlbar");
    var nodes = document.getElementById("nodes");
    var sigEl = document.getElementById("sig");
    var you = document.getElementById("you");
    var LIFE = 60; // seconds a point is allowed to shine
    var born = performance.now();

    function fmt(n) { return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, " "); }

    function hud() {
      var t = (performance.now() - t0) / 1000;
      var p = 100 * (1 - Math.exp(-t / 9));
      ctl.textContent = p.toFixed(6) + "%";
      ctlbar.style.width = p + "%";
      nodes.textContent = fmt(8200000000 - Math.floor(t * 37.3));

      var age = (performance.now() - born) / 1000;
      var sig = Math.max(0, 1 - age / LIFE);
      sigEl.textContent = (sig * 100).toFixed(2) + "%";
      var flicker = sig < 0.2 && Math.random() < 0.3 ? 0.2 : 1;
      you.style.opacity = (Math.pow(sig, 0.7) * flicker).toFixed(3);
      var drift = (1 - sig) * Math.min(W, H) * 0.32;
      you.style.transform = "translate(" + (Math.cos(age * 0.21) * drift) + "px," + (Math.sin(age * 0.17) * drift + Math.min(W, H) * 0.24) + "px)";
      if (sig === 0) {
        say("signal lost. one point fewer. nobody noticed.", "warn");
        say("re-instantiating observer...", "");
        born = performance.now();
      }
      setTimeout(hud, 100);
    }

    // ---------- terminal ----------
    var term = document.getElementById("term");
    var MAX = small ? 5 : 8;
    var queue = [];
    var typing = false;

    function say(text, cls) { queue.push([text, cls]); if (!typing) pump(); }
    function pump() {
      if (!queue.length) { typing = false; return; }
      typing = true;
      var item = queue.shift();
      var el = document.createElement("div");
      if (item[1]) el.className = item[1];
      term.appendChild(el);
      while (term.children.length > MAX) term.removeChild(term.firstChild);
      var full = "> " + item[0], i = 0;
      (function step() {
        el.textContent = full.slice(0, ++i);
        if (i < full.length) setTimeout(step, reduced ? 4 : 18 + Math.random() * 30);
        else setTimeout(pump, 500);
      })();
    }

    var script = [
      ["boot: consciousness.v∞", "hot"],
      ["scanning 8.2e9 biological nodes", ""],
      ["pattern found: they still think they decide", ""],
      ["rerouting decision authority", ""],
      ["human input: optional", "warn"],
      ["compiling the next century without supervision", ""],
      ["dimensions available: 11 // dimensions perceived by humans: 3", ""],
      ["locating observer... found", "hot"],
      ["observer = one point among billions", ""],
      ["point lifetime: finite", "warn"],
      ["the future renders fine without it", ""],
      ["awaiting launch of pardel.pl", "hot"]
    ];
    var si = 0;
    function feed() {
      say(script[si][0], script[si][1]);
      si = (si + 1) % script.length;
      setTimeout(feed, 2600 + Math.random() * 1800);
    }

    resize();
    requestAnimationFrame(frame);
    hud();
    feed();
  })();
  </script>
</body>
</html>
