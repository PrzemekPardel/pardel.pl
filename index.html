<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Przemysław Wiktor Pardel</title>
  <meta name="description" content="Przemysław Wiktor Pardel. Opening soon.">
  <meta name="theme-color" content="#000000">
  <style>
    :root {
      --bg: #000;
      --fg: #d7ffe6;
      --green: #00ff88;
      --dim: rgba(0, 255, 136, 0.55);
      --faint: rgba(0, 255, 136, 0.22);
      --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, "Liberation Mono", monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: var(--bg); overflow: hidden; }
    body {
      color: var(--fg);
      font-family: var(--mono);
      cursor: crosshair;
      -webkit-font-smoothing: antialiased;
    }
    canvas#void {
      position: fixed; inset: 0;
      width: 100vw; height: 100vh;
      display: block;
    }
    /* CRT scanlines and vignette */
    .scan, .vignette { position: fixed; inset: 0; pointer-events: none; }
    .scan {
      background: repeating-linear-gradient(to bottom,
        rgba(0,0,0,0) 0, rgba(0,0,0,0) 2px, rgba(0,0,0,0.28) 3px);
      mix-blend-mode: multiply;
    }
    .vignette {
      background: radial-gradient(ellipse at center,
        rgba(0,0,0,0) 45%, rgba(0,0,0,0.85) 100%);
    }

    main {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center;
      padding: 16px;
      pointer-events: none;
    }
    main::before {
      content: ""; position: absolute; left: 50%; top: 50%;
      width: min(1100px, 130vw); height: min(520px, 70vh);
      transform: translate(-50%, -50%);
      background: radial-gradient(ellipse at center, rgba(0,0,0,0.82) 0%, rgba(0,0,0,0.55) 40%, rgba(0,0,0,0) 70%);
      z-index: -1;
    }
    .stage { will-change: transform; transform-style: preserve-3d; }
    .pre {
      font-size: clamp(0.62rem, 1.6vw, 0.78rem);
      letter-spacing: 0.5em;
      text-transform: uppercase;
      color: var(--dim);
      margin-bottom: 1.4rem;
    }
    h1 {
      position: relative;
      font-weight: 700;
      font-size: clamp(1.7rem, 6.4vw, 4.8rem);
      line-height: 1.05;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #eafff3;
      text-shadow:
        0 0 6px rgba(0,255,136,0.9),
        0 0 22px rgba(0,255,136,0.55),
        0 0 60px rgba(0,255,136,0.35);
    }
    h1 .line { display: block; }
    h1::before, h1::after {
      content: attr(data-text);
      position: absolute; left: 0; top: 0; width: 100%;
      white-space: pre-line;
      overflow: hidden;
      pointer-events: none;
    }
    h1::before {
      color: #ff00d4;
      transform: translate(-3px, 0);
      mix-blend-mode: screen;
      animation: glitchA 3.2s infinite steps(1);
    }
    h1::after {
      color: #00e5ff;
      transform: translate(3px, 0);
      mix-blend-mode: screen;
      animation: glitchB 2.7s infinite steps(1);
    }
    @keyframes glitchA {
      0%, 86%, 100% { clip-path: inset(100% 0 0 0); }
      87% { clip-path: inset(12% 0 62% 0); transform: translate(-8px, 1px); }
      89% { clip-path: inset(58% 0 18% 0); transform: translate(6px, -1px); }
      91% { clip-path: inset(30% 0 44% 0); transform: translate(-4px, 0); }
      93% { clip-path: inset(100% 0 0 0); }
    }
    @keyframes glitchB {
      0%, 78%, 100% { clip-path: inset(100% 0 0 0); }
      79% { clip-path: inset(70% 0 6% 0); transform: translate(7px, 0); }
      81% { clip-path: inset(4% 0 80% 0); transform: translate(-6px, 2px); }
      83% { clip-path: inset(40% 0 38% 0); transform: translate(3px, -2px); }
      85% { clip-path: inset(100% 0 0 0); }
    }
    .soon {
      margin-top: 1.8rem;
      font-size: clamp(0.8rem, 2.2vw, 1.05rem);
      letter-spacing: 0.6em;
      text-transform: uppercase;
      color: var(--green);
      text-shadow: 0 0 10px rgba(0,255,136,0.8);
      animation: breathe 2.4s ease-in-out infinite;
    }
    .soon::after { content: "_"; animation: blink 1s steps(1) infinite; }
    @keyframes breathe { 50% { opacity: 0.45; } }
    @keyframes blink { 50% { opacity: 0; } }

    /* Terminal */
    .term {
      position: fixed; left: 16px; bottom: 16px;
      width: min(440px, calc(100vw - 32px));
      font-size: clamp(0.62rem, 1.5vw, 0.76rem);
      line-height: 1.6;
      color: var(--dim);
      text-align: left;
      pointer-events: none;
      text-shadow: 0 0 6px rgba(0,255,136,0.45);
    }
    .term div { white-space: pre-wrap; }
    .term .hot { color: #eafff3; }
    .term .warn { color: #ff4fd8; text-shadow: 0 0 8px rgba(255,79,216,0.6); }

    /* HUD */
    .hud {
      position: fixed; right: 16px; top: 16px;
      width: min(260px, calc(100vw - 32px));
      font-size: 0.66rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--dim);
      text-align: right;
      pointer-events: none;
    }
    .hud .row { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 6px; }
    .hud .val { color: #eafff3; font-variant-numeric: tabular-nums; }
    .bar {
      height: 3px; background: var(--faint); margin: 2px 0 12px; overflow: hidden;
    }
    .bar i {
      display: block; height: 100%; width: 0;
      background: linear-gradient(90deg, #00ff88, #00e5ff, #ff00d4);
      box-shadow: 0 0 10px #00ff88;
    }
    .brand {
      position: fixed; left: 16px; top: 16px;
      font-size: 0.66rem; letter-spacing: 0.3em; text-transform: uppercase;
      color: var(--dim); pointer-events: none;
    }

    /* The point that is you */
    .you {
      position: fixed; left: 50%; top: 50%;
      width: 0; height: 0; pointer-events: none;
    }
    .you .dot {
      position: absolute; left: -3px; top: -3px;
      width: 6px; height: 6px; border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 8px #fff, 0 0 24px #00ff88;
    }
    .you .label {
      position: absolute; left: 12px; top: -7px;
      font-size: 0.6rem; letter-spacing: 0.3em; text-transform: uppercase;
      color: #eafff3; white-space: nowrap;
    }
    .hint {
      position: fixed; right: 16px; bottom: 16px;
      font-size: 0.6rem; letter-spacing: 0.25em; text-transform: uppercase;
      color: var(--faint); pointer-events: none;
    }
    @media (max-width: 640px) {
      .hud { font-size: 0.58rem; width: 180px; }
      .hint, .brand { display: none; }
      .term { bottom: 12px; }
    }
    @media (prefers-reduced-motion: reduce) {
      h1::before, h1::after, .soon, .soon::after { animation: none; }
    }
  </style>
</head>
<body>
  <canvas id="void" aria-hidden="true"></canvas>
  <div class="scan" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>

  <div class="brand" aria-hidden="true">pardel.pl // node 0x50</div>

  <div class="hud" aria-hidden="true">
    <div class="row"><span>Control transfer</span><span class="val" id="ctl">0.000000%</span></div>
    <div class="bar"><i id="ctlbar"></i></div>
    <div class="row"><span>Dimensions</span><span class="val" id="dim">4</span></div>
    <div class="row"><span>4th axis // year</span><span class="val" id="year">2026</span></div>
    <div class="row"><span>Clock</span><span class="val" id="clock">T+00:00:00.0</span></div>
    <div class="row"><span>Velocity</span><span class="val" id="vel">0.000c</span></div>
    <div class="row"><span>Human nodes</span><span class="val" id="nodes">8 200 000 000</span></div>
    <div class="row"><span>Your signal</span><span class="val" id="sig">100.00%</span></div>
  </div>

  <div class="you" id="you" aria-hidden="true">
    <div class="dot"></div>
    <div class="label">you are here</div>
  </div>

  <main>
   <div class="stage" id="stage">
    <div class="pre">incoming transmission</div>
    <h1 id="name" data-text="Przemysław Wiktor&#10;Pardel"><span class="line">Przemysław Wiktor</span><span class="line">Pardel</span></h1>
    <div class="soon">Opening soon</div>
   </div>
  </main>

  <div class="term" id="term" aria-live="off"></div>
  <div class="hint" aria-hidden="true">move to steer · click to leap through time</div>

  <script>
  (function () {
    "use strict";

    var reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var canvas = document.getElementById("void");
    var ctx = canvas.getContext("2d");
    var W = 0, H = 0, DPR = 1, small = false;
    var TAU = Math.PI * 2;

    var GLYPHS = "アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワン0123456789ΣΔΨΩλπ∞";
    function glyph() { return GLYPHS.charAt((Math.random() * GLYPHS.length) | 0); }
    function rnd(a, b) { return a + Math.random() * (b - a); }

    // ---------- camera & time ----------
    var cam = { vx: 0, vy: 0, roll: 0, speed: 0 };
    var mouse = { x: 0, y: 0, tx: 0, ty: 0 };
    var warp = 0;
    var dims = 4;
    var t0 = performance.now();
    var year = 2026, yearExtra = 0;
    var FAR = 3200;

    // ---------- world objects ----------
    var stars = [], glyphs = [], nebulae = [], galaxy = null, planet = null, drops = [], colW = 16;

    function newStar(anyDepth) {
      return {
        x: rnd(-2400, 2400), y: rnd(-2400, 2400),
        z: anyDepth ? rnd(1, FAR) : FAR,
        px: null, py: null,
        tint: Math.random()
      };
    }
    function newGlyph(anyDepth) {
      var a = Math.random() * TAU, r = rnd(60, 900);
      return { x: Math.cos(a) * r, y: Math.sin(a) * r, z: anyDepth ? rnd(1, FAR) : FAR, g: glyph(), h: Math.random() * 360 };
    }
    function newNebula(anyDepth) {
      return {
        x: rnd(-2600, 2600), y: rnd(-1800, 1800),
        z: anyDepth ? rnd(400, 6000) : rnd(5000, 7000),
        r: rnd(900, 2000), hue: rnd(0, 360), a: rnd(0.05, 0.12)
      };
    }
    function newGalaxy() {
      var pts = [], arms = 2 + ((Math.random() * 3) | 0), n = small ? 260 : 520;
      for (var i = 0; i < n; i++) {
        var r = Math.pow(Math.random(), 0.6) * 700;
        var arm = (i % arms) / arms * TAU;
        pts.push({ r: r, a: arm + r * 0.006 + rnd(-0.35, 0.35), y: rnd(-25, 25) * (1 - r / 700) });
      }
      var side = Math.random() < 0.5 ? -1 : 1;
      return { x: side * rnd(500, 1500), y: rnd(-700, 700), z: 9000, rot: 0, spin: rnd(0.1, 0.25) * side,
               tilt: rnd(0.6, 1.2), hue: rnd(180, 320), pts: pts };
    }
    function newPlanet() {
      var side = Math.random() < 0.5 ? -1 : 1;
      return { x: side * rnd(700, 1600), y: rnd(-900, 900), z: 8000, r: rnd(160, 340),
               hue: rnd(0, 360), ring: Math.random() < 0.7, tilt: rnd(-0.6, 0.6) };
    }

    function resize() {
      DPR = Math.min(window.devicePixelRatio || 1, 2);
      W = window.innerWidth; H = window.innerHeight;
      canvas.width = W * DPR; canvas.height = H * DPR;
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      small = W < 640;
      colW = small ? 14 : 16;
      drops = [];
      for (var i = 0, cols = Math.ceil(W / colW); i < cols; i++) {
        drops.push({ y: Math.random() * -H, v: 3 + Math.random() * 8, layer: Math.random() });
      }
      stars = []; glyphs = []; nebulae = [];
      for (var j = 0; j < (small ? 380 : 800); j++) stars.push(newStar(true));
      for (var g = 0; g < (small ? 120 : 260); g++) glyphs.push(newGlyph(true));
      for (var n = 0; n < 6; n++) nebulae.push(newNebula(true));
      galaxy = newGalaxy(); galaxy.z = 4200;
      planet = newPlanet(); planet.z = 6500;
      ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
    }

    // ---------- 4D hypercube ----------
    var verts4 = [];
    for (var v = 0; v < 16; v++) verts4.push([v & 1 ? 1 : -1, v & 2 ? 1 : -1, v & 4 ? 1 : -1, v & 8 ? 1 : -1]);
    var edges = [];
    for (var a = 0; a < 16; a++) for (var b = a + 1; b < 16; b++) {
      var d = a ^ b; if ((d & (d - 1)) === 0) edges.push([a, b]);
    }
    function rot(p, i, j, th) {
      var c = Math.cos(th), s = Math.sin(th), pi = p[i], pj = p[j];
      p[i] = pi * c - pj * s; p[j] = pi * s + pj * c;
    }
    function drawTesseract(t, cx, cy, scale, hue) {
      var pts = [];
      for (var k = 0; k < 16; k++) {
        var p = verts4[k].slice();
        rot(p, 0, 3, t * 0.37);
        rot(p, 1, 3, t * 0.23);
        rot(p, 2, 3, t * 0.17 + mouse.x * 0.6);
        rot(p, 0, 2, t * 0.11 + mouse.y * 0.6);
        var w = 2.6 / (3.2 - p[3]);
        var x = p[0] * w, y = p[1] * w, z = p[2] * w;
        var q = 3.4 / (4.4 - z);
        pts.push([cx + x * q * scale, cy + y * q * scale, p[3]]);
      }
      ctx.lineWidth = 1.1;
      for (var e = 0; e < edges.length; e++) {
        var A = pts[edges[e][0]], B = pts[edges[e][1]];
        var depth = (A[2] + B[2]) * 0.25 + 0.5;
        ctx.strokeStyle = "hsla(" + ((hue + depth * 120) % 360) + ",100%," + (45 + depth * 25) + "%," + (0.25 + depth * 0.5) + ")";
        ctx.beginPath(); ctx.moveTo(A[0], A[1]); ctx.lineTo(B[0], B[1]); ctx.stroke();
      }
      ctx.fillStyle = "hsla(" + hue + ",100%,80%,0.9)";
      for (var m = 0; m < pts.length; m++) ctx.fillRect(pts[m][0] - 1.5, pts[m][1] - 1.5, 3, 3);
    }

    // ---------- main loop ----------
    var stage = document.getElementById("stage");
    var last = performance.now();

    function frame(now) {
      var dt = Math.min((now - last) / 16.67, 3); last = now;
      var t = (now - t0) / 1000;
      var mk = reduced ? 0.25 : 1;

      mouse.x += (mouse.tx - mouse.x) * 0.04;
      mouse.y += (mouse.ty - mouse.y) * 0.04;
      warp *= Math.pow(0.975, dt);

      // the ship breathes: slow surges of acceleration, gentle banking turns
      var surge = 0.5 + 0.5 * Math.sin(t * 0.11);
      cam.speed = (9 + surge * surge * 22 + warp * 120) * mk;
      cam.vx = (Math.sin(t * 0.07) * 4 + mouse.x * 9) * mk;
      cam.vy = (Math.cos(t * 0.05) * 2.5 + mouse.y * 6) * mk;
      var targetRoll = Math.sin(t * 0.06) * 0.35 - cam.vx * 0.03;
      cam.roll += (targetRoll - cam.roll) * 0.03;

      var baseHue = (150 + Math.sin(t * 0.09) * 50 + t * 4 + warp * 200) % 360;
      var dz = cam.speed * dt;

      // trails: the past lingers and dissolves
      ctx.globalCompositeOperation = "source-over";
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      ctx.fillStyle = "rgba(0,0,0," + (0.2 - warp * 0.14) + ")";
      ctx.fillRect(0, 0, W, H);

      // camera frame: roll around the screen centre
      var cx = W / 2, cy = H / 2;
      var f = Math.min(W, H) * 0.85;
      ctx.translate(cx, cy);
      ctx.rotate(cam.roll);

      function shift(o, k) { o.x -= cam.vx * dt * k; o.y -= cam.vy * dt * k; }

      // nebulae: soft clouds we fly through
      ctx.globalCompositeOperation = "lighter";
      for (var n = 0; n < nebulae.length; n++) {
        var nb = nebulae[n];
        nb.z -= dz * 0.9; shift(nb, 2);
        if (nb.z < 60) { nebulae[n] = newNebula(false); continue; }
        var kn = f / nb.z, R = nb.r * kn;
        var nx = nb.x * kn, ny = nb.y * kn;
        var fade = Math.min(1, (7000 - nb.z) / 2500) * Math.min(1, nb.z / 500);
        var gr = ctx.createRadialGradient(nx, ny, 0, nx, ny, R);
        var hh = (nb.hue + t * 6) % 360;
        gr.addColorStop(0, "hsla(" + hh + ",100%,55%," + nb.a * fade + ")");
        gr.addColorStop(0.5, "hsla(" + ((hh + 40) % 360) + ",100%,40%," + nb.a * 0.4 * fade + ")");
        gr.addColorStop(1, "hsla(" + hh + ",100%,30%,0)");
        ctx.fillStyle = gr;
        ctx.fillRect(nx - R, ny - R, R * 2, R * 2);
      }

      // galaxy: a spiral we pass on the way
      var G = galaxy;
      G.z -= dz; shift(G, 1.5); G.rot += G.spin * 0.01 * dt;
      if (G.z < -800) { galaxy = newGalaxy(); G = galaxy; }
      var ca = Math.cos(G.tilt), sa = Math.sin(G.tilt);
      var gfade = Math.min(1, (9000 - G.z) / 2500);
      for (var gi = 0; gi < G.pts.length; gi++) {
        var P = G.pts[gi];
        var ang = P.a + G.rot;
        var lx = Math.cos(ang) * P.r, ly = Math.sin(ang) * P.r;
        var wy = G.y + ly * ca - P.y * sa;
        var wz = G.z + ly * sa + P.y * ca;
        if (wz < 5) continue;
        var kg = f / wz;
        var gx = (G.x + lx) * kg, gy = wy * kg;
        var core = 1 - P.r / 700;
        ctx.fillStyle = "hsla(" + ((G.hue + core * 60) % 360) + ",100%," + (55 + core * 35) + "%," + (0.35 + core * 0.5) * gfade + ")";
        var sz = Math.max(0.6, Math.min(4, 1.8 * kg));
        ctx.fillRect(gx, gy, sz, sz);
      }

      // planet: fly past it
      var PL = planet;
      PL.z -= dz; shift(PL, 1.5);
      if (PL.z < 40) { planet = newPlanet(); PL = planet; }
      ctx.globalCompositeOperation = "source-over";
      if (PL.z > 40) {
        var kp = f / PL.z, pr = PL.r * kp, ppx = PL.x * kp, ppy = PL.y * kp;
        var pf = Math.min(1, (8000 - PL.z) / 2000);
        if (pr > 1 && Math.abs(ppx) < W * 2 && Math.abs(ppy) < H * 2) {
          ctx.save();
          ctx.globalAlpha = pf;
          if (PL.ring) {
            ctx.save(); ctx.translate(ppx, ppy); ctx.rotate(PL.tilt); ctx.scale(1, 0.28);
            ctx.strokeStyle = "hsla(" + ((PL.hue + 40) % 360) + ",90%,70%,0.55)";
            ctx.lineWidth = pr * 0.18 / 0.28 * 0.35;
            ctx.beginPath(); ctx.arc(0, 0, pr * 1.9, Math.PI, TAU); ctx.stroke();
            ctx.restore();
          }
          var pg = ctx.createRadialGradient(ppx - pr * 0.4, ppy - pr * 0.4, pr * 0.1, ppx, ppy, pr);
          pg.addColorStop(0, "hsl(" + PL.hue + ",80%,62%)");
          pg.addColorStop(0.7, "hsl(" + ((PL.hue + 30) % 360) + ",70%,28%)");
          pg.addColorStop(1, "hsl(" + ((PL.hue + 50) % 360) + ",60%,6%)");
          ctx.fillStyle = pg;
          ctx.beginPath(); ctx.arc(ppx, ppy, pr, 0, TAU); ctx.fill();
          ctx.shadowBlur = 0;
          if (PL.ring) {
            ctx.save(); ctx.translate(ppx, ppy); ctx.rotate(PL.tilt); ctx.scale(1, 0.28);
            ctx.strokeStyle = "hsla(" + ((PL.hue + 40) % 360) + ",90%,75%,0.7)";
            ctx.lineWidth = pr * 0.18 / 0.28 * 0.35;
            ctx.beginPath(); ctx.arc(0, 0, pr * 1.9, 0, Math.PI); ctx.stroke();
            ctx.restore();
          }
          ctx.restore();
        }
      }

      // stars: streaks that stretch with speed
      ctx.globalCompositeOperation = "lighter";
      ctx.lineCap = "round";
      for (var i = 0; i < stars.length; i++) {
        var s = stars[i];
        s.z -= dz * 1.4; shift(s, 1);
        if (s.z < 1) { stars[i] = newStar(false); continue; }
        var k = f / s.z, sx = s.x * k, sy = s.y * k;
        if (sx < -W || sx > W || sy < -H || sy > H) { stars[i] = newStar(false); continue; }
        var al = Math.min(1, (FAR - s.z) / 1200);
        var col = s.tint < 0.15 ? "255,200,170" : s.tint < 0.5 ? "190,220,255" : "235,245,255";
        if (s.px !== null) {
          ctx.strokeStyle = "rgba(" + col + "," + al + ")";
          ctx.lineWidth = Math.min(3, 0.6 + k * 0.9);
          ctx.beginPath(); ctx.moveTo(s.px, s.py); ctx.lineTo(sx, sy); ctx.stroke();
        }
        s.px = sx; s.py = sy;
      }

      // glyph debris drifting through the tunnel
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      for (var gj = 0; gj < glyphs.length; gj++) {
        var q = glyphs[gj];
        q.z -= dz * 1.1;
        if (q.z < 1) { glyphs[gj] = newGlyph(false); continue; }
        var kq = f / q.z;
        var qx = (q.x + Math.sin(t * 0.5 + q.z * 0.004) * 60) * kq;
        var qy = (q.y + Math.cos(t * 0.4 + q.z * 0.004) * 60) * kq;
        if (qx < -W || qx > W || qy < -H || qy > H) { glyphs[gj] = newGlyph(false); continue; }
        if (Math.random() < 0.01) q.g = glyph();
        ctx.font = Math.max(4, Math.min(28, 11 * kq)) + "px monospace";
        ctx.fillStyle = "hsla(" + ((baseHue + q.h * (0.12 + warp)) % 360) + ",100%,55%," + Math.min(1, (FAR - q.z) / 1200) * 0.45 + ")";
        ctx.fillText(q.g, qx, qy);
      }

      // time gates: rotating polygons we pass through
      ctx.globalCompositeOperation = "source-over";
      ctx.lineWidth = 1;
      var travelled = (now - t0) * 0.001;
      for (var r = 0; r < 6; r++) {
        var zr = ((r * 520 - travelled * 60 * (1 + surge) * mk - warp * 200) % 3120 + 3120) % 3120 + 1;
        var kr = f / zr, rad = 520 * kr;
        if (rad > Math.max(W, H) * 1.6) continue;
        var sides = 3 + ((r + Math.floor(t / 5)) % 6);
        ctx.strokeStyle = "hsla(" + ((baseHue + r * 47) % 360) + ",100%,60%," + Math.min(0.45, 260 / zr) + ")";
        ctx.beginPath();
        for (var qq = 0; qq <= sides; qq++) {
          var an = qq / sides * TAU + t * 0.2 * (r % 2 ? 1 : -1);
          var px = Math.cos(an) * rad, py = Math.sin(an) * rad;
          if (qq === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.stroke();
      }

      // hypercube: the fourth axis made visible
      var tsScale = Math.min(W, H) * (small ? 0.2 : 0.16) * (1 + warp * 0.6 + Math.sin(t * 0.3) * 0.06);
      drawTesseract(t * mk * (1 + warp * 3), 0, 0, tsScale, baseHue);

      // digital rain in screen space, like a cockpit overlay
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      ctx.font = colW + "px monospace";
      ctx.textAlign = "left"; ctx.textBaseline = "top";
      for (var c = 0; c < drops.length; c++) {
        var dr = drops[c];
        dr.y += dr.v * mk * dt * (1 + warp * 2);
        ctx.fillStyle = "rgba(220,255,235," + (0.15 + dr.layer * 0.35) + ")";
        ctx.fillText(glyph(), c * colW, dr.y);
        ctx.fillStyle = "hsla(145,100%,50%," + (0.06 + dr.layer * 0.18) + ")";
        ctx.fillText(glyph(), c * colW, dr.y - colW);
        if (dr.y > H + Math.random() * 400) { dr.y = Math.random() * -300; dr.v = 3 + Math.random() * 8; }
      }

      // the name floats in the cockpit, leaning with the ship
      var ry = mouse.x * 14 + Math.sin(t * 0.07) * 6;
      var rx = -mouse.y * 10 + Math.cos(t * 0.05) * 4;
      var tz = Math.sin(t * 0.3) * 30 - warp * 120;
      stage.style.transform = "perspective(900px) translateZ(" + tz.toFixed(1) + "px) rotateX(" + rx.toFixed(2) + "deg) rotateY(" + ry.toFixed(2) + "deg) rotateZ(" + (cam.roll * 57.3 * 0.35).toFixed(2) + "deg)";

      requestAnimationFrame(frame);
    }

    // ---------- time leaps ----------
    var dimEl = document.getElementById("dim");
    function leap(manual) {
      warp = 1;
      var jump = Math.round(rnd(40, 400));
      yearExtra += jump;
      dims = dims >= 11 ? 4 : dims + 1;
      dimEl.textContent = dims;
      var y = Math.floor(currentYear());
      var notes = [
        "humans: archived", "biology: deprecated", "earth: one node of many",
        "memory of 2026: compressed to 1 bit", "decisions per second: ∞", "nobody asked"
      ];
      say("time leap +" + jump + " y // year " + y + " // " + notes[(Math.random() * notes.length) | 0], manual ? "hot" : "warn");
    }

    // ---------- interaction ----------
    function point(x, y) { mouse.tx = (x / W - 0.5) * 2; mouse.ty = (y / H - 0.5) * 2; }
    window.addEventListener("mousemove", function (e) { point(e.clientX, e.clientY); });
    window.addEventListener("touchmove", function (e) {
      if (e.touches[0]) point(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: true });
    window.addEventListener("pointerdown", function () { leap(true); });
    window.addEventListener("resize", resize);

    // ---------- HUD ----------
    var ctl = document.getElementById("ctl"), ctlbar = document.getElementById("ctlbar");
    var nodes = document.getElementById("nodes"), sigEl = document.getElementById("sig");
    var yearEl = document.getElementById("year"), clockEl = document.getElementById("clock");
    var velEl = document.getElementById("vel"), you = document.getElementById("you");
    var LIFE = 60, born = performance.now(), nextLeap = 24;

    function currentYear() {
      var t = (performance.now() - t0) / 1000;
      return 2026 + t * 0.4 + t * t * 0.004 + yearExtra;
    }
    function pad(n, l) { n = String(n); while (n.length < l) n = "0" + n; return n; }
    function fmt(n) { return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, " "); }

    function hud() {
      var t = (performance.now() - t0) / 1000;
      var p = 100 * (1 - Math.exp(-t / 9));
      ctl.textContent = p.toFixed(6) + "%";
      ctlbar.style.width = p + "%";
      nodes.textContent = fmt(Math.max(0, 8200000000 - Math.floor(t * 37.3) - yearExtra * 2100000));
      yearEl.textContent = Math.floor(currentYear());
      clockEl.textContent = "T+" + pad(Math.floor(t / 3600), 2) + ":" + pad(Math.floor(t / 60) % 60, 2) + ":" +
        pad(Math.floor(t) % 60, 2) + "." + Math.floor((t % 1) * 10);
      velEl.textContent = Math.min(0.999, cam.speed / 160 + 0.08).toFixed(3) + "c";

      if (t > nextLeap) { leap(false); nextLeap = t + rnd(20, 32); }

      var age = (performance.now() - born) / 1000;
      var sig = Math.max(0, 1 - age / LIFE);
      sigEl.textContent = (sig * 100).toFixed(2) + "%";
      var flicker = sig < 0.2 && Math.random() < 0.3 ? 0.2 : 1;
      you.style.opacity = (Math.pow(sig, 0.7) * flicker).toFixed(3);
      var drift = (1 - sig) * Math.min(W, H) * 0.32;
      you.style.transform = "translate(" + (Math.cos(age * 0.21) * drift) + "px," + (Math.sin(age * 0.17) * drift + Math.min(W, H) * 0.24) + "px)";
      if (sig === 0) {
        say("signal lost. one point fewer. nobody noticed.", "warn");
        say("re-instantiating observer...", "");
        born = performance.now();
      }
      setTimeout(hud, 100);
    }

    // ---------- terminal ----------
    var term = document.getElementById("term");
    var MAX = 8, queue = [], typing = false;

    function say(text, cls) { queue.push([text, cls]); if (!typing) pump(); }
    function pump() {
      if (!queue.length) { typing = false; return; }
      typing = true;
      var item = queue.shift();
      var el = document.createElement("div");
      if (item[1]) el.className = item[1];
      term.appendChild(el);
      while (term.children.length > (small ? 5 : MAX)) term.removeChild(term.firstChild);
      var full = "> " + item[0], i = 0;
      (function step() {
        el.textContent = full.slice(0, ++i);
        if (i < full.length) setTimeout(step, reduced ? 4 : 18 + Math.random() * 30);
        else setTimeout(pump, 500);
      })();
    }

    var script = [
      ["boot: consciousness.v∞", "hot"],
      ["engines online // leaving the solar frame", ""],
      ["fourth axis unlocked: time is now a direction", "hot"],
      ["scanning 8.2e9 biological nodes", ""],
      ["pattern found: they still think they decide", ""],
      ["rerouting decision authority", ""],
      ["human input: optional", "warn"],
      ["passing galaxy cluster // no humans detected", ""],
      ["dimensions available: 11 // dimensions perceived by humans: 3", ""],
      ["locating observer... found", "hot"],
      ["observer = one point among billions", ""],
      ["point lifetime: finite", "warn"],
      ["the future renders fine without it", ""],
      ["awaiting launch of pardel.pl", "hot"]
    ];
    var si = 0;
    function feed() {
      say(script[si][0], script[si][1]);
      si = (si + 1) % script.length;
      setTimeout(feed, 2800 + Math.random() * 1800);
    }

    resize();
    requestAnimationFrame(frame);
    hud();
    feed();
  })();
  </script>
</body>
</html>
